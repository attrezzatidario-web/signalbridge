name: Pulizia file vecchi
on:
  push:
    paths: ['.github/workflows/setup.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          git rm -r -q --ignore-unmatch supabase app/src/lib/supa.js app/src/pages/Setup.jsx engine/db.py
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git diff --cached --quiet && exit 0
          git commit -m "Rimuove Supabase"
          git pull --rebase
          git push
